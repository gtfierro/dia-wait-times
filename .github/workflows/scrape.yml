name: Scrape DIA Wait Times

on:
  push:
  workflow_dispatch:
  # schedule:
  #   # Run every hour at minute 15
  #   - cron: "15 * * * *"

permissions:
  contents: write

jobs:
  scrape-wait-times:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/cache@v3
        name: Configure pip caching
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-browsers

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright dependencies
        run: shot-scraper install

      - name: Create output directories
        run: |
          mkdir -p screenshots
          mkdir -p data

      - name: Take screenshots
        run: |
          shot-scraper multi shots.yml

      - name: Scrape wait times data as JSON
        run: |
          shot-scraper javascript https://www.flydenver.com/waittimesmonitorsview/ \
            --javascript "$(cat scrape.js)" \
            --output data/wait-times.json \
            --wait 3000

      - name: Commit and push if changes
        run: |-
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          timestamp=$(date -u)
          git commit -m "Updated wait times: ${timestamp}" || exit 0
          git pull --rebase
          git push
